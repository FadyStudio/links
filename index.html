<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="كل الأدوات واللينكات اللي في فيديوهات فادي جورج على تيك توك.">
  <title>أدوات فادي جورج</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EFG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #5c5c5c;
      --card: #f3f3f1;
      --line: #e2e2df;
      --button: #111111;
      --button-fg: #ffffff;
      --focus: #2f6bff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c0c0c;
        --fg: #f4f4f2;
        --muted: #a5a5a0;
        --card: #171717;
        --line: #2a2a2a;
        --button: #f4f4f2;
        --button-fg: #0c0c0c;
        --focus: #7ea2ff;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c0c0c;
      --fg: #f4f4f2;
      --muted: #a5a5a0;
      --card: #171717;
      --line: #2a2a2a;
      --button: #f4f4f2;
      --button-fg: #0c0c0c;
      --focus: #7ea2ff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .mark {
      flex: none; width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--button); color: var(--button-fg);
      font: 700 20px/1 Arial, sans-serif; letter-spacing: .5px;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.3; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
    .search { position: relative; margin-bottom: 18px; }
    .search input {
      width: 100%; padding: 13px 16px; font: inherit; font-size: 16px;
      color: var(--fg); background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; outline: none;
    }
    .search input:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
    .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    li {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px; scroll-margin-top: 16px;
    }
    li:target { border-color: var(--fg); }
    .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .kind { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
    h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.45; }
    .hook { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; }
    .links a {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 10px 18px; border-radius: 10px;
      background: var(--button); color: var(--button-fg);
      font-weight: 600; font-size: 15px; text-decoration: none;
    }
    .links a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .empty { text-align: center; color: var(--muted); padding: 36px 8px; }
    footer { margin-top: 32px; color: var(--muted); font-size: 14px; text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">FG</div>
      <div>
        <h1>أدوات فادي جورج</h1>
        <p class="sub">كل الأدوات واللينكات اللي في فيديوهاتي على تيك توك</p>
      </div>
    </header>

    <div class="search">
      <label for="q" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">دوّر على أداة</label>
      <input id="q" type="search" placeholder="دوّر على اسم الأداة أو الفيديو…" autocomplete="off">
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>

    <footer>
      <a href="https://www.tiktok.com/@_fady.george" rel="noopener">تيك توك <bdi dir="ltr">@_fady.george</bdi></a>
      ·
      <a href="https://www.instagram.com/_fadygeorge/" rel="noopener">إنستجرام <bdi dir="ltr">@_fadygeorge</bdi></a>
    </footer>
  </main>

  <script>
    // Tools appear when their video goes live on TikTok ("live" in tools.json), newest first.
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    const input = document.getElementById("q");
    let tools = [];

    // Arabic search that ignores hamza/alef forms, taa marbuta, final yaa, diacritics and tatweel.
    const fold = (text) => (text || "")
      .toLowerCase()
      .replace(/[ً-ٰٟـ]/g, "")
      .replace(/[أإآٱ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/ى/g, "ي");

    const dateLabel = (iso) => new Date(iso).toLocaleDateString("ar-EG", { day: "numeric", month: "long" });

    function card(tool) {
      const li = document.createElement("li");
      li.id = tool.id;
      const meta = document.createElement("div");
      meta.className = "meta";
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = tool.kind;
      const date = document.createElement("span");
      date.textContent = dateLabel(tool.live);
      meta.append(kind, date);
      const title = document.createElement("h2");
      title.textContent = tool.name;
      const hook = document.createElement("p");
      hook.className = "hook";
      hook.textContent = tool.hook;
      const links = document.createElement("div");
      links.className = "links";
      for (const link of tool.links) {
        const a = document.createElement("a");
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = link.label;
        links.append(a);
      }
      li.append(meta, title, hook, links);
      return li;
    }

    function render() {
      const q = fold(input.value.trim());
      const shown = tools.filter((t) => !q || fold(`${t.name} ${t.hook} ${t.kind}`).includes(q));
      list.replaceChildren(...shown.map(card));
      empty.hidden = shown.length > 0;
      empty.textContent = tools.length ? "مفيش نتيجة. جرّب كلمة تانية." : "أول أداة هتنزل هنا مع أول فيديو.";
      count.textContent = tools.length ? `${shown.length} من ${tools.length} أداة` : "";
      if (location.hash && !q) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    }

    fetch("tools.json", { cache: "no-cache" })
      .then((response) => response.json())
      .then((all) => {
        const now = Date.now();
        tools = all.filter((t) => Date.parse(t.live) <= now).sort((a, b) => Date.parse(b.live) - Date.parse(a.live));
        render();
      })
      .catch(() => {
        empty.hidden = false;
        empty.textContent = "الصفحة مش راضية تحمّل دلوقتي. جرّب تاني بعد شوية.";
      });
    input.addEventListener("input", render);
  </script>
</body>
</html>
